name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --disable-sandbox
      - name: Build universal preview
        run: ./script/package_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenInc-universal-preview
          path: |
            dist/*.dmg
            dist/*.sha256
